appConfig:
  theme: colorful
  layout: auto
  language: en
pageInfo:
  title: Dashy
  description: Welcome to your new dashboard!
  navLinks:
    - title: GitHub
      path: https://github.com/Lissy93/dashy
    - title: Documentation
      path: https://dashy.to/docs
sections:
  - name: Getting Started
    icon: fas fa-rocket
    items:
      - title: GitHub
        description: Source Code, Issues and Pull Requests
        url: https://github.com/lissy93/dashy
        icon: si-github
      - title: Docs
        description: Configuring & Usage Documentation
        provider: Dashy.to
        icon: far fa-book
        url: https://dashy.to/docs
  - name: Clock
    icon: clock
    items: []
    widgets:
      - type: clock
        updateInterval: 0.7
  - name: Weather
    items:
      - title: WeatherWise Radar
        icon: fas fa-cloud-sun-rain
        url: "https://web.weatherwise.app/#map=7.63/39.131/-94.734&rt=KEAX&rp=REF0&m=RADAR&oid=USA/SPC/CONVECTIVE/CATEGORICAL&ost=DAY_1&sid=GOES-18&sr=FD&sp=ABI-L1b-C11"
  target: newtab
        target: newtab
    widgets:
      - type: iframe
        label: WeatherWise
        useProxy: false
        ignoreErrors: false
        options:
          url: '[https://www.espn.com/](https://www.espn.com/)'
    icon: fas fa-cloud-sun-rain
pages: []
