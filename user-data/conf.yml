appConfig:
  theme: colorful
  layout: auto
  language: en
pageInfo:
  title: Dashy
  description: Welcome to your new dashboard!
  navLinks:
    - title: GitHub
      path: https://github.com/Lissy93/dashy
    - title: Documentation
      path: https://dashy.to/docs
sections:
  - name: GitHub
    icon: fas fa-rocket
    items:
      - title: GitHub Editor
        description:
        url: https://github.com/ReillyRairi/dashy/edit/master/user-data/conf.yml
        icon: si-github
  - name: Clock
    icon: clock
    items: []
    widgets:
      - type: clock
        updateInterval: 0.7
  - name: Weather
    items:
      - title: WeatherWise Radar
        icon: fas fa-cloud-sun-rain
        url: "https://web.weatherwise.app/#map=7.63/39.131/-94.734&rt=KEAX&rp=REF0&m=RADAR&oid=USA/SPC/CONVECTIVE/CATEGORICAL&ost=DAY_1&sid=GOES-18&sr=FD&sp=ABI-L1b-C11"
        target: newtab
    widgets:
      - type: iframe
        label: WeatherWise
        useProxy: false
        ignoreErrors: false
        options:
          url: "https://web.weatherwise.app/#map=7.63/39.131/-94.734&rt=KEAX&rp=REF0&m=RADAR&oid=USA/SPC/CONVECTIVE/CATEGORICAL&ost=DAY_1&sid=GOES-18&sr=FD&sp=ABI-L1b-C11"
    icon: fas fa-cloud-sun-rain
pages: []
