appConfig:
  theme: colorful
  layout: auto
  language: en
pageInfo:
  title: Dashy
  description: Welcome to your new dashboard!
  navLinks:
    - title: GitHub
      path: https://github.com/Lissy93/dashy
    - title: Documentation
      path: https://dashy.to/docs
sections:
  - name: Weather
    icon: fas fa-cloud-sun
    widgets:
      - type: weather
        options:
          apiKey: "e9635bc6d721bb3a227bec96b01cd355"
          city: "Kansas City, US"
          units: imperial
  - name: GitHub
    icon: fas fa-rocket
    items:
      - title: GitHub Editor
        description: Edit configuration file
        url: https://github.com/ReillyRairi/dashy/edit/master/user-data/conf.yml
        icon: si-github
  - name: Clock
    icon: fas fa-clock
    items: []
    widgets:
      - type: clock
        options:
          timeZone: "America/Chicago"
          format: "12hour"
pages: []
